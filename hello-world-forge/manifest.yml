modules:
  macro:
    - key: forge-bar-chart-macro
      resource: forge-main
      render: native
      title: A bar chart
      description: Displays a simple configurable Forge bar chart.
      config:
        resource: forge-macro-config
        render: native
        viewportSize: max
        title: Configure A bar chart
    - key: custom-bar-chart-macro
      resource: main
      render: native
      title: bar chart 2
      description: Displays a simple configurable custom bar chart and opens the standard Forge configuration panel in edit mode.
      config:
        resource: bar-chart-2-config-v2
        render: default
        viewportSize: max
        title: Configure bar chart 2
    - key: custom-bar-chart-macro-v2
      resource: main
      render: native
      title: bar chart 2 new
      description: Displays a simple configurable custom bar chart and opens the standard Forge configuration panel in edit mode.
      config:
        resource: bar-chart-2-config-v3
        render: default
        viewportSize: max
        title: Configure bar chart 2 new
    - key: table-bar-chart-macro-v1
      resource: table-bar-main-v1
      render: native
      title: table bar chart view
      description: Displays a bar chart using a linked table data source.
      config:
        resource: table-bar-cfg1
        render: default
        viewportSize: max
        title: Configure table bar chart view
    - key: table-data-source-v1
      resource: table-source-main1
      render: native
      title: table data source
      description: Stores a Confluence table as a reusable chart data source and displays the table in published view.
      layout: bodied
      config:
        resource: table-src-cfg1
        render: default
        viewportSize: max
        title: Configure table data source
resources:
  - key: forge-main
    path: src/frontend/forge-index.jsx
  - key: forge-macro-config
    path: src/frontend/forge-config.jsx
  - key: main
    path: src/frontend/index.jsx
  - key: table-bar-main-v1
    path: src/frontend/table-bar-index.jsx
  - key: table-source-main1
    path: src/frontend/table-source-index.jsx
  - key: bar-chart-2-config-v2
    path: src/static/bar-chart-2-config
  - key: bar-chart-2-config-v3
    path: src/static/bar-chart-2-config-v3
  - key: table-bar-cfg1
    path: src/static/bar-chart-table-config-v1
  - key: table-src-cfg1
    path: src/static/table-source-config-v1
  - key: bar-chart-2-frame
    path: src/static/bar-chart-2
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/fdc530ca-15f8-43ae-8c8b-8c508039d50d
