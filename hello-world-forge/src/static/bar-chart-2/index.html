<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bar Chart 2</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #172b4d;
        font-family: Arial, sans-serif;
      }

      #root {
        width: 100%;
      }

      .status {
        padding: 12px 0;
        color: #44546f;
        font-size: 14px;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="status">Loading chart...</div>
    </div>
    <script>
      (() => {
        const DEFAULTS = {
          title: "Quarterly sales",
          data: "Q1,12\nQ2,18\nQ3,9\nQ4,22",
          color: "blue",
          backgroundColor: "#FFFFFF",
          gradientStartColor: "blue",
          gradientEndColor: "teal",
          gradientStops: [
            { color: "blue", offset: 0 },
            { color: "teal", offset: 100 }
          ],
          axisInterval: 10,
          width: 480,
          height: 320,
          leftPlotPadding: 0,
          barWidth: 48,
          barGap: 12,
          useGradient: true
        };

        const COLOR_OPTIONS = [
          { value: "blue", hex: "#0052CC" },
          { value: "green", hex: "#36B37E" },
          { value: "red", hex: "#DE350B" },
          { value: "orange", hex: "#FF8B00" },
          { value: "purple", hex: "#6554C0" },
          { value: "teal", hex: "#00B8D9" }
        ];

        const FRAME_READY_EVENT = "bar-chart-2:ready";
        const FRAME_UPDATE_EVENT = "bar-chart-2:update";
        const root = document.getElementById("root");

        const callBridge = (name, payload) => {
          if (!window.__bridge || typeof window.__bridge.callBridge !== "function") {
            throw new Error("Forge bridge unavailable");
          }

          return window.__bridge.callBridge(name, payload);
        };

        const normalizeColor = (rawValue) => {
          const value = String(rawValue ?? "").trim();
          return COLOR_OPTIONS.some((option) => option.value === value) ? value : DEFAULTS.color;
        };

        const isHexColor = (value) => /^#([0-9a-fA-F]{6})$/.test(String(value ?? "").trim());

        const normalizeGradientColor = (rawValue, fallback = DEFAULTS.color) => {
          const value = String(rawValue ?? "").trim();
          if (COLOR_OPTIONS.some((option) => option.value === value)) {
            return value;
          }

          return isHexColor(value) ? value.toUpperCase() : fallback;
        };

        const normalizeDimension = (rawValue, fallback, min, max) => {
          const value = Number(rawValue);
          if (!Number.isFinite(value)) {
            return fallback;
          }

          return Math.min(Math.max(value, min), max);
        };

        const normalizeGradientStops = (rawValue, fallbackStartColor, fallbackEndColor) => {
          if (!Array.isArray(rawValue)) {
            return [
              { color: normalizeGradientColor(fallbackStartColor), offset: 0 },
              { color: normalizeGradientColor(fallbackEndColor), offset: 100 }
            ];
          }

          const normalized = rawValue
            .map((stop, index) => ({
              color: normalizeGradientColor(stop && stop.color, index === 0 ? normalizeGradientColor(fallbackStartColor) : normalizeGradientColor(fallbackEndColor)),
              offset: normalizeDimension(stop && stop.offset, index === 0 ? 0 : 100, 0, 100)
            }))
            .sort((left, right) => left.offset - right.offset);

          return normalized.length >= 2
            ? normalized
            : [
                { color: normalizeGradientColor(fallbackStartColor), offset: 0 },
                { color: normalizeGradientColor(fallbackEndColor), offset: 100 }
              ];
        };

        const normalizeBackgroundColor = (rawValue) => {
          const value = String(rawValue ?? "").trim();
          return /^#([0-9a-fA-F]{6})$/.test(value) ? value.toUpperCase() : DEFAULTS.backgroundColor;
        };

        const escapeXml = (value) =>
          String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&apos;");

        const parseRows = (rawValue) =>
          String(rawValue ?? "")
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line, index) => {
              const parts = line.split(",");
              const label = parts[0] ? parts[0].trim() : "";
              const value = parts[1] ? Number(parts[1].trim()) : NaN;

              if (!label || !Number.isFinite(value)) {
                throw new Error("Line " + (index + 1) + " must look like Label,Value");
              }

              return { label, value };
            });

        const createPayloadFromConfig = (config) => {
          const color = normalizeColor(config.color);
          const colorOption = COLOR_OPTIONS.find((option) => option.value === color) || COLOR_OPTIONS[0];
          const gradientStartColor = normalizeGradientColor(config.gradientStartColor || config.color || DEFAULTS.gradientStartColor);
          const gradientEndColor = normalizeGradientColor(config.gradientEndColor || config.color || DEFAULTS.gradientEndColor);
          const gradientStartOption = COLOR_OPTIONS.find((option) => option.value === gradientStartColor);
          const gradientEndOption = COLOR_OPTIONS.find((option) => option.value === gradientEndColor);
          const gradientStops = normalizeGradientStops(config.gradientStops, gradientStartColor, gradientEndColor);

          return {
            title: String(config.title ?? "").trim() || DEFAULTS.title,
            rows: parseRows(config.data ?? DEFAULTS.data),
            width: normalizeDimension(config.width, DEFAULTS.width, 240, 900),
            height: normalizeDimension(config.height, DEFAULTS.height, 240, 700),
            leftPlotPadding: normalizeDimension(config.leftPlotPadding, DEFAULTS.leftPlotPadding, 0, 120),
            barWidth: normalizeDimension(config.barWidth, DEFAULTS.barWidth, 12, 120),
            barGap: normalizeDimension(config.barGap, DEFAULTS.barGap, 0, 48),
            axisInterval: normalizeDimension(config.axisInterval, DEFAULTS.axisInterval, 1, 100),
            useGradient: true,
            color,
            backgroundColor: normalizeBackgroundColor(config.backgroundColor),
            colorHex: colorOption.hex,
            gradientStartColor,
            gradientStartHex: isHexColor(gradientStartColor) ? gradientStartColor.toUpperCase() : (gradientStartOption || colorOption).hex,
            gradientEndColor,
            gradientEndHex: isHexColor(gradientEndColor) ? gradientEndColor.toUpperCase() : (gradientEndOption || colorOption).hex,
            gradientStops: gradientStops.map((stop) => ({
              color: stop.color,
              offset: stop.offset,
              hex: isHexColor(stop.color) ? stop.color.toUpperCase() : (COLOR_OPTIONS.find((option) => option.value === stop.color) || colorOption).hex
            }))
          };
        };

        const buildSvg = (payload) => {
          const rows = payload.rows;
          const rawMaxValue = Math.max(...rows.map((row) => row.value), 1);
          const maxValue = Math.max(rawMaxValue, 10);
          const titleHeight = 0;
          const valueLabelHeight = 22;
          const plotTop = titleHeight + valueLabelHeight;
          const plotHeight = payload.height;
          const axisGap = 8;
          const labelRowHeight = 24;
          const leftPad = 36;
          const rightPad = 12;
          const axisY = plotTop + plotHeight;
          const labelY = axisY + 18;
          const innerWidth =
            payload.leftPlotPadding +
            rows.length * payload.barWidth +
            Math.max(0, rows.length - 1) * payload.barGap;
          const svgWidth = Math.max(payload.width, leftPad + innerWidth + rightPad);
          const svgHeight = axisY + axisGap + labelRowHeight;
          const plotRight = svgWidth - rightPad;
          const guides = Array.from(
            { length: Math.floor(rawMaxValue / payload.axisInterval) },
            (_, index) => (index + 1) * payload.axisInterval
          );
          const dividerX =
            rows.length === 2 ? leftPad + payload.barWidth + payload.barGap / 2 : null;

          const defs =
            "<defs>" +
            rows
              .map(
                (_, index) =>
                  '<linearGradient id="bar-gradient-' +
                  index +
                  '" x1="0" y1="0" x2="0" y2="1">' +
                  payload.gradientStops
                    .map(
                      (stop) =>
                        '<stop offset="' +
                        stop.offset +
                        '%" stop-color="' +
                        stop.hex +
                        '" stop-opacity="1"/>'
                    )
                    .join("") +
                  "</linearGradient>"
              )
              .join("") +
            "</defs>";

          const guideMarkup = guides
            .map((guide) => {
              const y = plotTop + plotHeight - (guide / maxValue) * plotHeight;
              return '<line x1="' + leftPad + '" y1="' + y + '" x2="' + plotRight + '" y2="' + y + '" stroke="#8590A2" stroke-width="1" />';
            })
            .join("");

          const yLabels = guides
            .map((guide) => {
              const y = plotTop + plotHeight - (guide / maxValue) * plotHeight;
              return '<text x="' + (leftPad - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="12" fill="#44546F">' + guide + "</text>";
            })
            .join("");

          const dividerMarkup =
            dividerX === null
              ? ""
              : '<line x1="' +
                dividerX +
                '" y1="' +
                plotTop +
                '" x2="' +
                dividerX +
                '" y2="' +
                axisY +
                '" stroke="#C1C7D0" stroke-width="1" />';

          const bars = rows
            .map((row, index) => {
              const x = leftPad + payload.leftPlotPadding + index * (payload.barWidth + payload.barGap);
              const barHeight = Math.max(8, Math.round((row.value / maxValue) * plotHeight));
              const y = axisY - barHeight;
              const fill = payload.useGradient ? "url(#bar-gradient-" + index + ")" : payload.colorHex;

              return [
                '<text x="' + (x + payload.barWidth / 2) + '" y="' + (plotTop - 6) + '" text-anchor="middle" font-size="12" fill="#172B4D">' + escapeXml(row.value) + "</text>",
                '<rect x="' + x + '" y="' + y + '" width="' + payload.barWidth + '" height="' + barHeight + '" rx="4" ry="4" fill="' + fill + '" />',
                '<text x="' + (x + payload.barWidth / 2) + '" y="' + labelY + '" text-anchor="middle" font-size="12" fill="#172B4D">' + escapeXml(row.label) + "</text>"
              ].join("");
            })
            .join("");

          return (
            '<svg xmlns="http://www.w3.org/2000/svg" width="' +
            svgWidth +
            '" height="' +
            svgHeight +
            '" viewBox="0 0 ' +
            svgWidth +
            " " +
            svgHeight +
            '">' +
            defs +
            '<rect x="0" y="0" width="' +
            svgWidth +
            '" height="' +
            svgHeight +
            '" fill="' +
            payload.backgroundColor +
            '" />' +
            guideMarkup +
            '<line x1="' +
            leftPad +
            '" y1="' +
            plotTop +
            '" x2="' +
            leftPad +
            '" y2="' +
            axisY +
            '" stroke="#172B4D" stroke-width="2" />' +
            '<line x1="' +
            leftPad +
            '" y1="' +
            axisY +
            '" x2="' +
            plotRight +
            '" y2="' +
            axisY +
            '" stroke="#172B4D" stroke-width="2" />' +
            yLabels +
            dividerMarkup +
            bars +
            "</svg>"
          );
        };

        const renderStatus = (message) => {
          root.innerHTML = '<div class="status">' + escapeXml(message) + "</div>";
        };

        const renderChart = (payload) => {
          root.innerHTML = buildSvg(payload);
        };

        const init = async () => {
          try {
            const context = await callBridge("getContext");
            const config = context && context.extension ? context.extension.config || {} : {};
            renderChart(createPayloadFromConfig(config));
          } catch (error) {
            renderStatus(error instanceof Error ? error.message : "Unable to load chart.");
          }

          try {
            await callBridge("on", {
              event: FRAME_UPDATE_EVENT,
              callback: (payload) => {
                try {
                  renderChart(payload);
                } catch (error) {
                  renderStatus(error instanceof Error ? error.message : "Unable to render chart.");
                }
              }
            });

            await callBridge("emit", { event: FRAME_READY_EVENT });
          } catch (error) {
            renderStatus(error instanceof Error ? error.message : "Unable to subscribe to chart updates.");
          }
        };

        init();
      })();
    </script>
  </body>
</html>
